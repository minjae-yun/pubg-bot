            <p class="eyebrow" data-reveal>${esc(m.map)} · ${esc(m.date)} · ${esc(m.mode || "스쿼드")}</p>
            <p class="rank-giant num" data-reveal>#${m.placement ?? "-"}</p>
            <h1 class="display-md" data-reveal>${title}</h1>
            <div class="sum" data-reveal>
              <div><strong class="num">${m.kills}</strong><span>팀 킬</span></div>
              <div><strong class="num">${fmt(m.damage)}</strong><span>팀 딜량</span></div>
              <div><strong class="num">${Math.floor(m.durationSeconds / 60)}:${String(m.durationSeconds % 60).padStart(2, "0")}</strong><span>경기 시간</span></div>
            </div>
          </div>
        </header>
        ${linkedImage ? `<section class="section-sm"><div class="wrap">${mediaArt(m.map, m.matchId, '<span class="art-chip">연결된 경기 스크린샷</span>', linkedImage)}</div></section>` : ""}
        <section class="section"><div class="wrap">
          <div class="head" data-reveal><div><h2 class="display-md">팀원별 기록</h2><p>AI 봇 킬은 제외한 사람 상대 킬만 표시해요</p></div></div>
          <div class="team">${m.team.map(t => `
            <a class="member ${t === mvp ? "is-mvp" : ""}" ${t.id ? `href="#/player/${encodeURIComponent(t.id)}"` : ""} style="color:inherit;text-decoration:none">
              <div class="member-top"><div><h3>${esc(t.name)}</h3><p class="role">${esc(t.pubgName)}${t.died ? "" : " · 생존"}</p></div>${t === mvp ? '<span class="badge green">MVP</span>' : ""}</div>
              <dl class="mini"><div><dt>킬</dt><dd class="num">${t.kills}</dd></div><div><dt>어시</dt><dd class="num">${t.assists}</dd></div><div><dt>딜량</dt><dd class="num">${fmt(t.damage)}</dd></div></dl>
              <div class="share"><div class="share-label"><span>팀 딜 비중</span><span>${Math.round(t.damageShare)}%</span></div><div class="bar"><i data-width="${t.damageShare}"></i></div></div>
            </a>`).join("") || '<div class="empty">기록된 파티원이 없어요</div>'}</div>
          <div class="match-nav">
            ${m.olderMatchId ? `<a class="btn-primary btn-ghost" style="display:inline-flex;align-items:center;text-decoration:none" href="#/match/${encodeURIComponent(m.olderMatchId)}">‹ 이전 경기</a>` : '<span></span>'}
            ${m.newerMatchId ? `<a class="btn-primary" style="display:inline-flex;align-items:center;text-decoration:none" href="#/match/${encodeURIComponent(m.newerMatchId)}">다음 경기 ›</a>` : ""}
          </div>
        </div></section>`;
    }

    /* ---------- Motion (GSAP ScrollTrigger) ---------- */
    function setCount(el, value) {
      const d = Number(el.dataset.decimals || 0);
      el.textContent = Number(value).toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d }) + (el.dataset.suffix || "");
    }
    function countUp(el) {
      const target = Number(el.dataset.count);
      if (!hasGsap) { setCount(el, target); return; }
      const obj = { v: 0 };
      gsap.to(obj, { v: target, duration: 1.4, ease: "power3.out", onUpdate: () => setCount(el, obj.v) });
    }
    const tweenIn = (targets, from, extra = {}) => {
      const els = gsap.utils.toArray(targets);
      els.forEach(el => { el.style.transition = "none"; });
      return gsap.fromTo(els, from, { x: 0, y: 0, scale: 1, opacity: 1, ease: "power3.out", clearProps: "all", ...extra });
    };
    function fillBars(scope) {
      scope.querySelectorAll("[data-width]").forEach(el => { el.style.width = el.dataset.width + "%"; });
    }

    function initMotion(screen) {
      if (!hasGsap) {
        screen.querySelectorAll("[data-count]").forEach(el => setCount(el, el.dataset.count));
        fillBars(screen);
        return;
      }
      ScrollTrigger.getAll().forEach(t => t.kill());

      // 1) 스크롤하면 아래에서 위로 떠오르는 등장 효과
      const items = screen.querySelectorAll("[data-reveal]");
      gsap.set(items, { opacity: 0, y: 48 });
      ScrollTrigger.batch(items, {
        start: "top 90%",
        once: true,
        onEnter: batch => gsap.to(batch, { opacity: 1, y: 0, duration: .8, ease: "power3.out", stagger: .09, overwrite: true })
      });

      // 2) 숫자 카운트업 + 막대 채우기
      screen.querySelectorAll("[data-count]").forEach(el => {
        setCount(el, 0);
        ScrollTrigger.create({ trigger: el, start: "top 92%", once: true, onEnter: () => countUp(el) });
      });
      screen.querySelectorAll("[data-width]").forEach(el => {
        ScrollTrigger.create({ trigger: el, start: "top 95%", once: true, onEnter: () => { el.style.width = el.dataset.width + "%"; } });
      });

      // 3) 히어로 패럴랙스 (스크롤하면 천천히 밀려 올라가며 흐려짐)
      const hero = screen.querySelector(".hero");
      const parallax = screen.querySelector(".parallax");
      if (hero && parallax) {
        gsap.fromTo(parallax, { yPercent: 0, opacity: 1 }, { yPercent: -18, opacity: .25, ease: "none", scrollTrigger: { trigger: hero, start: "top top", end: "bottom top", scrub: true } });
      }

      // 4) 마퀴 띠가 스크롤 속도에 따라 기울어짐
      const marquee = screen.querySelector(".marquee");
      if (marquee) {
        const skew = gsap.quickTo(marquee, "skewX", { duration: .4, ease: "power3" });
        ScrollTrigger.create({ trigger: marquee, start: "top bottom", end: "bottom top", onUpdate: self => skew(gsap.utils.clamp(-8, 8, self.getVelocity() / -250)) , onLeave: () => skew(0), onLeaveBack: () => skew(0) });
      }

      // 5) 카드 그리드 계단식 등장
      screen.querySelectorAll(".stats, .feature-grid, .team").forEach(grid => {
        tweenIn(grid.children, { y: 60, opacity: 0, scale: .96 }, { duration: .8, stagger: .1, scrollTrigger: { trigger: grid, start: "top 88%", once: true } });
      });
      ScrollTrigger.refresh();
    }

    /* ---------- Carousel (slide) ---------- */
    function initCarousel(name) {
      const root = document.querySelector(`[data-carousel="${name}"]`);
      const track = root.querySelector(".car-track");
      const dotsHost = root.querySelector("[data-car-dots]");
      const prev = document.querySelector(`[data-car-prev="${name}"]`);
      const next = document.querySelector(`[data-car-next="${name}"]`);
      const cards = [...track.children];
      const step = () => cards.length > 1 ? cards[1].offsetLeft - cards[0].offsetLeft : track.clientWidth;
      const maxIndex = () => Math.max(0, Math.round((track.scrollWidth - track.clientWidth) / step()));

      function renderDots() {
        const count = maxIndex() + 1;
        dotsHost.innerHTML = Array.from({ length: count }, (_, i) => `<button type="button" class="dot" aria-label="${i + 1}번째로 이동" data-dot="${i}"></button>`).join("");
        update();
      }
      function update() {
        const i = Math.round(track.scrollLeft / step());
        dotsHost.querySelectorAll(".dot").forEach((d, k) => d.classList.toggle("is-active", k === i));
        prev.disabled = track.scrollLeft <= 4;
        next.disabled = track.scrollLeft >= track.scrollWidth - track.clientWidth - 4;
      }
      prev.onclick = () => track.scrollBy({ left: -step() });
      next.onclick = () => track.scrollBy({ left: step() });
      dotsHost.onclick = e => { const d = e.target.closest("[data-dot]"); if (d) track.scrollTo({ left: Number(d.dataset.dot) * step() }); };
      track.addEventListener("scroll", () => requestAnimationFrame(update), { passive: true });
      window.addEventListener("resize", renderDots);

      // 마우스로 잡고 끌어서 넘기기
      let down = false, startX = 0, startLeft = 0, moved = false;
      track.addEventListener("pointerdown", e => {
        if (e.pointerType !== "mouse") return;
        down = true; moved = false; startX = e.clientX; startLeft = track.scrollLeft;
      });
      window.addEventListener("pointermove", e => {
        if (!down) return;
        const dx = e.clientX - startX;
        if (Math.abs(dx) > 5) { moved = true; track.classList.add("is-dragging"); }
        if (moved) track.scrollLeft = startLeft - dx;
      });
      window.addEventListener("pointerup", () => {
        if (!down) return;
        down = false;
        if (moved) {
          track.classList.remove("is-dragging");
          track.scrollTo({ left: Math.round(track.scrollLeft / step()) * step() });
          const block = ev => { ev.stopPropagation(); ev.preventDefault(); };
          track.addEventListener("click", block, true);
          setTimeout(() => track.removeEventListener("click", block, true), 0);
        }
      });
      // 키보드 좌우 화살표
      track.tabIndex = 0;
      track.addEventListener("keydown", e => {
        if (e.key === "ArrowRight") { e.preventDefault(); next.click(); }
        if (e.key === "ArrowLeft") { e.preventDefault(); prev.click(); }
      });
      renderDots();
    }


    /* ---------- 실제 API 데이터 연결 ---------- */
    const SITE_ROOT = API.replace(/\/api$/, "");
    let uploadMatches = [];
    const absoluteMediaUrl = value => value?.startsWith("/") ? SITE_ROOT + value : value || "";
    const compactDate = value => value ? value.slice(5, 10).replace("-", ".") : "날짜 없음";
    const duration = seconds => `${Math.floor((seconds || 0) / 60)}:${String((seconds || 0) % 60).padStart(2, "0")}`;

    function mapHighlights(items) {
      return items.map((h, index) => ({
        id: h.id,
        title: h.title,
        desc: h.description || "등록 대원이 직접 고른 장면이에요.",
        who: h.name,
        map: h.map || "경기 미연결",
        date: compactDate(h.matchDate || h.createdAt),
        likes: h.likes || 0,
        feature: index === 0,
        mediaUrl: absoluteMediaUrl(h.mediaUrl),
        mediaType: h.mediaType,
        matchId: h.matchId
      }));
    }

    async function bootstrap() {
      app.innerHTML = '<section class="section"><div class="wrap"><div class="empty">DROPLOG 기록을 불러오는 중...</div></div></section>';
      try {
        const [summary, playerList, recent, weapons, teamKills, mission, hall, highlights, config, updates] = await Promise.all([
          api("/summary"), api("/players"), api("/matches/recent?limit=12"), api("/weapons?limit=24"),
          api("/teamkills"), api("/missions/leaderboard"), api("/missions/hall-of-fame"),
          api("/highlights?limit=50"), api("/highlights/config"), api("/updates?limit=8")
        ]);
        const detailRows = await Promise.all(playerList.map(async base => {
          const [detail, insights] = await Promise.all([
            api(`/players/${encodeURIComponent(base.id)}`),
            api(`/players/${encodeURIComponent(base.id)}/insights`)
          ]);
          return { base, detail, insights };
        }));
        const teamKillMap = new Map(teamKills.map(row => [row.id, row]));
        const missionMap = new Map(mission.rows.map(row => [row.id, row]));

        MOCK.players = detailRows.map(({ detail, insights }) => {
          const tk = teamKillMap.get(detail.id) || { teamKills: 0, enemyKills: detail.kills, share: 0 };
          const score = missionMap.get(detail.id) || { points: 0, missions: 0, rank: null };
          MOCK.weeks[detail.id] = insights.trend?.weeks || [];
          MOCK.growth[detail.id] = insights.trend?.me || { adr: [], kd: [], top10: [] };
          MOCK.squadGrowth[detail.id] = insights.trend?.squad || { adr: [], kd: [], top10: [] };
          return {
            id: detail.id, name: detail.displayName, pubg: detail.pubgName, games: detail.games,
            kd: detail.kd, adr: detail.adr, top10: detail.top10, wins: detail.wins, kills: detail.kills,
            hs: detail.headshotRate, longest: detail.longestKill, teamKills: tk.teamKills,
            teamKillShare: tk.share, points: score.points, missions: score.missions,
            missionRank: score.rank, teamKillDetail: insights.teamKills
          };
        });

        MOCK.weapons = weapons.map(w => ({
          name: w.name, cat: w.category, kills: w.kills,
          top: w.top.map(row => [row.name, row.kills, row.id])
        }));
        MOCK.highlights = mapHighlights(highlights);
        uploadMatches = recent;
        MOCK.matches = recent.slice(0, 3).map(m => ({
          id: m.matchId, map: m.map, date: compactDate(m.date), mode: m.mode,
          dur: duration(m.durationSeconds), placement: m.placement, kills: m.kills, damage: m.damage,
          photoUrl: MOCK.highlights.find(h => h.matchId === m.matchId && h.mediaType === "image")?.mediaUrl || ""
        }));
        const [year, month] = mission.month.split("-");
        MOCK.summary = summary;
        MOCK.season = { label: `${year}년 ${Number(month)}월 미션 시즌`, remainingDays: mission.remainingDays };
        MOCK.hof = hall.map(row => [
          `${row.month.slice(0, 4)}년 ${Number(row.month.slice(5))}월`, row.name,
          `${fmt(row.points)}점 · 미션 ${row.missions}개`
        ]);
        MOCK.patches = updates.map(item => {
          const version = item.title.match(/update\s*([\d.]+)/i)?.[1];
          return {
            v: version ? `UPDATE ${version}` : "PUBG 공식 공지", date: item.date || "최근",
            title: item.title, tags: item.tags?.length ? item.tags : ["change"], summary: item.summary,
            impact: "공식 공지 원문에서 총기 반동·맵 복각·시스템 변경을 확인할 수 있어요.", url: item.url
          };
        });
        uploadConfig = config;
        const playerNav = document.querySelector('[data-nav="player"]');
        if (playerNav && MOCK.players[0]) playerNav.href = `#/player/${encodeURIComponent(MOCK.players[0].id)}`;
        fillUploadOptions();
        if (!location.hash) history.replaceState(null, "", "#/");
        await router();
      } catch (error) {
        app.innerHTML = `<section class="section"><div class="wrap"><div class="empty">실제 기록을 불러오지 못했어요.<br>${esc(error.message)}<br><small>봇 폴더에서 npm run web을 실행했는지 확인해 주세요.</small></div></div></section>`;
      }
    }

    function fillUploadOptions() {
      $("f-who").innerHTML = MOCK.players.map(p => `<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.pubg)}</option>`).join("");
      $("f-match").innerHTML = '<option value="">연결 안 함</option>' + uploadMatches.map(m =>
        `<option value="${esc(m.matchId)}">${compactDate(m.date)} ${esc(m.map)} · #${m.placement ?? "-"}</option>`
      ).join("");
      $("drop").querySelector("span:last-of-type").textContent = `MP4 · WebM · JPG · PNG · 최대 ${uploadConfig.maxUploadMb}MB`;
    }

    /* ---------- 업로드 모달 ---------- */
    const modal = $("upload-modal");
    let selectedUploadFile = null;
    document.addEventListener("click", e => {
      if (e.target.closest("[data-open-upload]")) {
        modal.classList.add("on");
        $("upload-status").textContent = uploadConfig.uploadEnabled ? "영상 링크나 파일 중 하나를 선택해 주세요." : ".env에 WEB_ADMIN_KEY를 설정하고 웹 서버를 다시 켜면 업로드할 수 있어요.";
        setTimeout(() => $("f-title").focus(), 50);
      }
      if (e.target.closest("[data-close]") || e.target === modal) modal.classList.remove("on");
    });
    document.addEventListener("keydown", e => { if (e.key === "Escape") modal.classList.remove("on"); });
    const drop = $("drop");
    ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("drag"); }));
    drop.addEventListener("dragleave", e => { e.preventDefault(); drop.classList.remove("drag"); });
    drop.addEventListener("drop", e => {
      e.preventDefault(); drop.classList.remove("drag");
      selectedUploadFile = e.dataTransfer.files[0] || null;
      if (selectedUploadFile) drop.querySelector("strong").textContent = selectedUploadFile.name;
    });
    $("f-file").addEventListener("change", e => {
      selectedUploadFile = e.target.files[0] || null;
      if (selectedUploadFile) drop.querySelector("strong").textContent = selectedUploadFile.name;
    });
    $("upload-form").addEventListener("submit", async e => {
      e.preventDefault();
      const status = $("upload-status");
      const title = $("f-title").value.trim();
      const link = $("f-link").value.trim();
      const accountId = $("f-who").value;
      const matchId = $("f-match").value;
      const description = $("f-desc").value.trim();
      const key = $("f-key").value;
      if (!uploadConfig.uploadEnabled) { status.textContent = "먼저 .env에서 WEB_ADMIN_KEY를 설정해 주세요."; return; }
      if (!title || (!selectedUploadFile && !link)) { status.textContent = "제목과 영상 파일 또는 링크를 입력해 주세요."; return; }
      status.textContent = "업로드 중... 창을 닫지 마세요.";
      try {
        const headers = { "X-Admin-Key": key };
        let options;
        if (selectedUploadFile) {
          Object.assign(headers, {
            "Content-Type": selectedUploadFile.type,
            "X-Account-Id": encodeURIComponent(accountId),
            "X-Title": encodeURIComponent(title),
            "X-Description": encodeURIComponent(description),
            "X-Match-Id": encodeURIComponent(matchId)
          });
          options = { method: "POST", headers, body: selectedUploadFile };
        } else {
          headers["Content-Type"] = "application/json";
          options = { method: "POST", headers, body: JSON.stringify({ accountId, title, description, matchId: matchId || null, mediaUrl: link }) };
        }
        await api("/highlights", options);
        MOCK.highlights = mapHighlights(await api("/highlights?limit=50"));
        MOCK.matches.forEach(m => { m.photoUrl = MOCK.highlights.find(h => h.matchId === m.id && h.mediaType === "image")?.mediaUrl || ""; });
        $("upload-form").reset(); selectedUploadFile = null;
        drop.querySelector("strong").textContent = "영상 파일을 끌어다 놓거나 눌러서 선택";
        modal.classList.remove("on"); location.hash = "#/highlights"; await router();
      } catch (error) {
        status.textContent = error.message;
      }
    });

    /* ---------- 스크롤 진행바 · 내비 숨김 · 맨 위로 ---------- */
    let lastY = 0;
    window.addEventListener("scroll", () => {
      const y = window.scrollY, max = document.documentElement.scrollHeight - window.innerHeight;
      $("progress").style.transform = `scaleX(${max > 0 ? y / max : 0})`;
      $("nav").classList.toggle("is-hidden", y > lastY && y > 160);
      $("to-top").classList.toggle("is-visible", y > 600);
      lastY = y;
    }, { passive: true });
    $("to-top").addEventListener("click", () => window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }));

    bootstrap();
  </script>
</body>
</html>

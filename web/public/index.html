<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DROPLOG — 디스코드 봇에 등록된 스쿼드의 PUBG 전적">
  <title>DROPLOG · 디자인 시안 v2</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <style>
    /* Discord-style tokens (DESIGN.md) */
    :root {
      --canvas: #0a0d3a;
      --indigo: #1e2353;
      --indigo-hi: #2a3070;
      --black: #000000;
      --primary: #5865f2;
      --green: #35ed7e;
      --magenta: #ec48bd;
      --link: #00b0f4;
      --ink: #ffffff;
      --ink-dark: #000000;
      --muted: rgba(255, 255, 255, 0.68);
      --faint: rgba(255, 255, 255, 0.44);
      --line: rgba(255, 255, 255, 0.10);
      --r-xs: 6px; --r-sm: 12px; --r-md: 14px; --r-lg: 16px; --r-xl: 40px; --r-pill: 50px;
      --font: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --max: 1200px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: auto; overflow-x: clip; }
    body {
      margin: 0; min-width: 320px; overflow-x: hidden;
      background: var(--canvas); color: var(--ink);
      font-family: var(--font); font-size: 16px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    .num { font-variant-numeric: tabular-nums; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    :focus-visible { outline: 3px solid var(--link); outline-offset: 3px; }
    .motion [data-reveal] { opacity: 0; }

    /* Scroll progress + nav */
    .progress { position: fixed; top: 0; left: 0; z-index: 40; height: 3px; width: 100%; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(90deg, var(--primary), var(--magenta)); }
    .nav {
      position: sticky; top: 0; z-index: 30;
      background: rgba(10, 13, 58, 0.82); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      transition: transform .35s ease;
    }
    .nav.is-hidden { transform: translateY(-100%); }
    .nav-inner { max-width: var(--max); margin: 0 auto; height: 68px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 10px; border: 0; padding: 0; background: none; cursor: pointer; font-size: 20px; font-weight: 900; letter-spacing: -0.02em; }
    .brand-dot { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff 0 18%, var(--primary) 19% 60%, var(--magenta) 61%); }
    .nav-links { display: flex; gap: 4px; }
    .nav-link { border: 0; background: none; cursor: pointer; padding: 10px 16px; border-radius: var(--r-lg); font-size: 16px; font-weight: 500; color: var(--muted); transition: background .2s, color .2s; }
    .nav-link:hover { color: var(--ink); background: var(--indigo); }
    .nav-link[aria-selected="true"] { color: var(--ink); background: var(--primary); }

    /* Screens */
    .screen { display: none; }
    .screen.is-active { display: block; }
    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 24px; }
    .section { padding: 96px 0; }
    .section-sm { padding: 64px 0; }

    /* Hero + animated mesh */
    .hero { position: relative; overflow: hidden; padding: 120px 0 140px; border-radius: 0 0 88px 88px; isolation: isolate; }
    .mesh { position: absolute; inset: -20%; z-index: -1; filter: blur(70px); opacity: .9; }
    .mesh span { position: absolute; border-radius: 50%; }
    .mesh span:nth-child(1) { width: 50%; height: 60%; left: 5%; top: 10%; background: var(--primary); animation: float1 16s ease-in-out infinite alternate; }
    .mesh span:nth-child(2) { width: 45%; height: 55%; right: 0; top: 0; background: #7a3bd9; animation: float2 18s ease-in-out infinite alternate; }
    .mesh span:nth-child(3) { width: 40%; height: 45%; left: 35%; bottom: 0; background: var(--magenta); opacity: .75; animation: float3 14s ease-in-out infinite alternate; }
    .hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(10,13,58,.15), rgba(10,13,58,.55)); }
    @keyframes float1 { to { transform: translate(18%, 12%) scale(1.1); } }
    @keyframes float2 { to { transform: translate(-20%, 18%) scale(.9); } }
    @keyframes float3 { to { transform: translate(-15%, -20%) scale(1.15); } }

    .eyebrow { display: inline-block; margin: 0 0 18px; padding: 6px 14px; border-radius: var(--r-pill); background: rgba(255,255,255,.12); font-size: 14px; font-weight: 500; }
    .display-xl { margin: 0; font-size: clamp(48px, 8.5vw, 104px); font-weight: 900; line-height: .98; letter-spacing: -0.03em; text-transform: uppercase; }
    .display-md { margin: 0; font-size: clamp(34px, 5vw, 56px); font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; }
    .heading-sm { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.2; }
    .lead { margin: 22px 0 0; max-width: 620px; font-size: clamp(17px, 2vw, 20px); font-weight: 500; line-height: 1.4; color: var(--muted); }
    .center { text-align: center; }
    .center .lead { margin-left: auto; margin-right: auto; }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }

    /* Search */
    .search { max-width: 620px; margin: 40px auto 0; }
    .search-field { display: flex; gap: 8px; padding: 8px; border-radius: 20px; background: rgba(30, 35, 83, .82); backdrop-filter: blur(10px); box-shadow: 0 3px 68px rgba(69, 42, 124, .35); transition: box-shadow .25s; }
    .search-field:focus-within { box-shadow: 0 0 0 3px var(--primary), 0 3px 68px rgba(88, 101, 242, .45); }
    .search-input { flex: 1; min-width: 0; height: 52px; padding: 0 16px; border: 0; outline: 0; background: transparent; font-size: 18px; }
    .search-input::placeholder { color: var(--faint); }
    .btn-green { flex: none; height: 52px; padding: 0 28px; border: 0; border-radius: var(--r-sm); background: var(--green); color: var(--ink-dark); font-size: 18px; font-weight: 700; cursor: pointer; transition: transform .15s, filter .15s; }
    .btn-green:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-green:active { transform: scale(.97); }
    .search-help { margin: 12px 0 0; font-size: 14px; color: var(--faint); }
    .notice { display: none; max-width: 620px; margin: 16px auto 0; padding: 18px 22px; border-radius: var(--r-lg); background: var(--indigo); border-left: 4px solid var(--magenta); text-align: left; }
    .notice.is-visible { display: block; animation: shake .4s ease; }
    .notice strong { display: block; font-size: 18px; }
    .notice p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
    @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 28px; }
    .chip { height: 40px; padding: 0 18px; border: 0; border-radius: var(--r-pill); background: rgba(255,255,255,.12); font-size: 15px; font-weight: 500; cursor: pointer; transition: background .2s, transform .2s; }
    .chip:hover { background: var(--ink); color: var(--ink-dark); transform: translateY(-2px); }

    /* Marquee */
    .marquee { overflow: hidden; margin-top: 48px; background: var(--primary); padding: 22px 0; transform: rotate(-1.5deg); }
    .marquee-track { display: flex; width: max-content; animation: marquee 28s linear infinite; }
    .marquee-track span { padding-right: 48px; font-size: clamp(34px, 5vw, 62px); font-weight: 900; letter-spacing: -0.02em; text-transform: uppercase; white-space: nowrap; }
    .marquee-track span i { font-style: normal; color: var(--green); }
    @keyframes marquee { to { transform: translateX(-50%); } }

    /* Stat cards */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .stat { padding: 32px; border-radius: var(--r-xl); background: var(--indigo); min-height: 190px; display: flex; flex-direction: column; justify-content: space-between; }
    .stat.blurple { background: var(--primary); }
    .stat.magenta { background: linear-gradient(135deg, var(--magenta), #9b3be0); }
    .stat-value { display: block; font-size: clamp(40px, 5vw, 56px); font-weight: 900; line-height: 1; letter-spacing: -0.03em; }
    .stat-label { display: block; margin-top: 10px; font-size: 18px; font-weight: 700; }
    .stat-note { display: block; margin-top: 2px; font-size: 14px; color: rgba(255,255,255,.75); }
    .meter { height: 8px; margin-top: 16px; border-radius: var(--r-pill); background: rgba(255,255,255,.18); overflow: hidden; }
    .meter span { display: block; height: 100%; border-radius: inherit; background: var(--green); width: 0; }

    /* Section head */
    .head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 36px; }
    .head p { margin: 8px 0 0; color: var(--muted); }

    /* Carousel */
    .carousel { position: relative; }
    .car-track { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding: 4px 4px 20px; margin: 0 -4px; scrollbar-width: none; cursor: grab; }
    .car-track::-webkit-scrollbar { display: none; }
    .car-track.is-dragging { cursor: grabbing; scroll-snap-type: none; scroll-behavior: auto; }
    .car-track.is-dragging * { pointer-events: none; }
    .car-controls { display: flex; align-items: center; gap: 12px; }
    .car-btn { width: 48px; height: 48px; border: 0; border-radius: 50%; background: var(--indigo); font-size: 22px; cursor: pointer; transition: background .2s, opacity .2s; }
    .car-btn:hover:not(:disabled) { background: var(--primary); }
    .car-btn:disabled { opacity: .35; cursor: default; }
    .dots { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
    .dot { width: 8px; height: 8px; padding: 0; border: 0; border-radius: var(--r-pill); background: rgba(255,255,255,.25); cursor: pointer; transition: width .3s, background .3s; }
    .dot.is-active { width: 28px; background: var(--ink); }

    .member-card { flex: 0 0 calc((100% - 48px) / 4); min-width: 240px; scroll-snap-align: start; padding: 28px; border: 0; border-radius: var(--r-xl); background: var(--indigo); text-align: left; cursor: pointer; transition: transform .3s ease, background .3s; }
    .member-card:hover { transform: translateY(-6px); background: var(--indigo-hi); }
    .member-card:nth-child(4n+1) { background: var(--primary); }
    .member-card:nth-child(4n+3) { background: linear-gradient(135deg, var(--magenta), #9b3be0); }
    .avatar { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.25); font-size: 22px; font-weight: 900; }
    .member-card h3 { margin: 22px 0 0; font-size: 22px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
    .member-card .id { margin: 2px 0 0; font-size: 14px; color: rgba(255,255,255,.7); }
    .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 28px 0 0; }
    .mini dt { font-size: 12px; color: rgba(255,255,255,.7); }
    .mini dd { margin: 0; font-size: 22px; font-weight: 800; }

    /* Match feature cards */
    .feature-grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 16px; }
    .match-card { position: relative; overflow: hidden; display: flex; flex-direction: column; min-height: 280px; padding: 32px; border: 0; border-radius: var(--r-xl); background: var(--indigo); text-align: left; cursor: pointer; transition: transform .3s ease; }
    .match-card:hover { transform: scale(1.02); }
    .match-card.is-feature { background: linear-gradient(135deg, var(--magenta) 0%, #8a3be0 55%, var(--primary) 100%); }
    .match-card .meta { font-size: 14px; font-weight: 500; color: rgba(255,255,255,.75); }
    .match-card .big-rank { margin-top: auto; font-size: clamp(64px, 8vw, 96px); font-weight: 900; line-height: .9; letter-spacing: -0.04em; }
    .match-card h3 { margin: 12px 0 0; font-size: 22px; font-weight: 700; }
    .match-card p { margin: 6px 0 0; color: rgba(255,255,255,.75); font-size: 15px; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: var(--r-lg); background: var(--magenta); font-size: 13px; font-weight: 700; vertical-align: middle; }
    .badge.green { background: var(--green); color: var(--ink-dark); }
    .match-card .badge { position: absolute; top: 28px; right: 28px; }
    .match-card.is-feature .badge { background: var(--green); color: var(--ink-dark); }

    /* Operator hero */
    .op-hero { padding: 96px 0 120px; }
    .back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 28px; padding: 8px 16px; border: 0; border-radius: var(--r-lg); background: rgba(255,255,255,.12); font-size: 14px; font-weight: 500; cursor: pointer; transition: background .2s; }
    .back:hover { background: rgba(255,255,255,.22); }
    .op-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 24px; }
    .op-meta span { padding: 8px 16px; border-radius: var(--r-pill); background: rgba(0,0,0,.25); font-size: 15px; font-weight: 500; }

    /* Segmented tabs */
    .seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: var(--r-lg); background: var(--indigo); }
    .seg button { height: 40px; padding: 0 18px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--muted); font-size: 15px; font-weight: 600; cursor: pointer; transition: background .2s, color .2s; }
    .seg button[aria-selected="true"] { background: var(--ink); color: var(--ink-dark); }

    .map-panel { display: grid; grid-template-columns: 1fr 1.4fr; gap: 16px; }
    .map-hero { padding: 40px; border-radius: var(--r-xl); background: var(--black); display: flex; flex-direction: column; justify-content: space-between; min-height: 260px; }
    .map-hero .badge { align-self: flex-start; }
    .map-hero h3 { margin: 0; font-size: clamp(44px, 6vw, 72px); font-weight: 900; line-height: 1; letter-spacing: -0.03em; }
    .map-bars { padding: 36px 40px; border-radius: var(--r-xl); background: var(--indigo); display: grid; gap: 22px; align-content: center; }
    .bar-row { display: grid; grid-template-columns: 90px 1fr 70px; align-items: center; gap: 16px; }
    .bar-row span:first-child { font-size: 15px; color: var(--muted); }
    .bar { height: 12px; border-radius: var(--r-pill); background: rgba(255,255,255,.1); overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), var(--magenta)); width: 0; transition: width .9s cubic-bezier(.2,.8,.2,1); }
    .bar-row strong { text-align: right; font-size: 20px; font-weight: 800; }

    /* Rank rows + pagination */
    .rows { display: grid; gap: 10px; min-height: 420px; align-content: start; }
    .row { display: grid; grid-template-columns: 64px 1fr auto auto; align-items: center; gap: 18px; padding: 16px 20px; border-radius: var(--r-md); background: var(--indigo); cursor: pointer; transition: background .2s; }
    .row:hover { background: var(--indigo-hi); }
    .row:hover .row-arrow { color: var(--ink); transform: translateX(4px); }
    .row-arrow { transition: transform .2s, color .2s; }
    .row-rank { width: 52px; height: 52px; display: grid; place-items: center; border-radius: var(--r-sm); background: rgba(255,255,255,.08); font-size: 20px; font-weight: 900; }
    .row.is-top .row-rank { background: var(--primary); }
    .row.is-win .row-rank { background: var(--green); color: var(--ink-dark); }
    .row-title { margin: 0; font-size: 17px; font-weight: 700; }
    .row-sub { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
    .row-date { font-size: 14px; color: var(--faint); }
    .row-arrow { font-size: 20px; color: var(--faint); }
    .pager { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 28px; }
    .pager button { min-width: 44px; height: 44px; padding: 0 10px; border: 0; border-radius: var(--r-sm); background: var(--indigo); font-size: 16px; font-weight: 700; cursor: pointer; transition: background .2s; }
    .pager button:hover:not(:disabled) { background: var(--indigo-hi); }
    .pager button[aria-current="page"] { background: var(--primary); }
    .pager button:disabled { opacity: .35; cursor: default; }
    .pager-info { margin-top: 12px; text-align: center; font-size: 14px; color: var(--faint); }
    .empty { padding: 40px; border-radius: var(--r-md); background: var(--indigo); text-align: center; color: var(--muted); }

    /* Report */
    .rank-giant { margin: 0; font-size: clamp(120px, 22vw, 240px); font-weight: 900; line-height: .85; letter-spacing: -0.06em; background: linear-gradient(180deg, #fff 30%, rgba(255,255,255,.35)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sum { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 36px; }
    .sum div { min-width: 150px; padding: 18px 24px; border-radius: var(--r-lg); background: rgba(0,0,0,.28); }
    .sum strong { display: block; font-size: 34px; font-weight: 900; line-height: 1.1; }
    .sum span { font-size: 14px; color: var(--muted); }
    .team { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .member { padding: 28px; border-radius: var(--r-xl); background: var(--indigo); }
    .member.is-mvp { background: var(--primary); }
    .member-top { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
    .member h3 { margin: 0; font-size: 22px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
    .member .role { margin: 2px 0 0; font-size: 14px; color: rgba(255,255,255,.7); }
    .member .mini { margin-top: 24px; }
    .share { margin-top: 20px; }
    .share-label { display: flex; justify-content: space-between; font-size: 13px; color: rgba(255,255,255,.75); }
    .share .bar { margin-top: 6px; height: 8px; background: rgba(0,0,0,.25); }
    .member.is-mvp .bar i { background: var(--green); }
    .match-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; }
    .btn-primary { height: 56px; padding: 0 24px; border: 0; border-radius: var(--r-sm); background: var(--primary); font-size: 18px; font-weight: 600; cursor: pointer; transition: filter .2s, transform .15s; }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.12); }
    .btn-primary:active:not(:disabled) { transform: scale(.97); }
    .btn-primary:disabled { opacity: .35; cursor: default; }
    .btn-ghost { background: var(--indigo); }

    /* Back to top + footer */
    .to-top { position: fixed; right: 24px; bottom: 24px; z-index: 30; width: 56px; height: 56px; border: 0; border-radius: 50%; background: var(--primary); font-size: 22px; font-weight: 900; cursor: pointer; box-shadow: 0 8px 30px rgba(88,101,242,.5); opacity: 0; transform: translateY(20px) scale(.8); pointer-events: none; transition: opacity .3s, transform .3s; }
    .to-top.is-visible { opacity: 1; transform: none; pointer-events: auto; }
    .footer { padding: 80px 0 40px; overflow: hidden; }
    .footer-word { margin: 0; font-size: clamp(64px, 17vw, 220px); font-weight: 900; line-height: .8; letter-spacing: -0.06em; color: var(--indigo); text-align: center; user-select: none; }
    .footer p { margin: 32px 0 0; text-align: center; font-size: 14px; color: var(--faint); }

    @media (max-width: 1023px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .member-card { flex-basis: calc((100% - 32px) / 3); }
      .feature-grid { grid-template-columns: 1fr 1fr; }
      .feature-grid .match-card:first-child { grid-column: 1 / -1; }
      .team { grid-template-columns: repeat(2, 1fr); }
      .map-panel { grid-template-columns: 1fr; }
    }
    @media (max-width: 767px) {
      .nav-inner { height: 60px; padding: 0 16px; }
      .brand span:last-child { display: none; }
      .nav-link { padding: 8px 12px; font-size: 15px; }
      .wrap { padding: 0 16px; }
      .section { padding: 72px 0; }
      .hero { padding: 72px 0 96px; border-radius: 0 0 48px 48px; }
      .search-field { flex-direction: column; }
      .btn-green { width: 100%; }
      .stat { padding: 24px; border-radius: 28px; min-height: 160px; }
      .member-card { flex-basis: 78%; }
      .feature-grid { grid-template-columns: 1fr; }
      .head { flex-direction: column; align-items: start; }
      .row { grid-template-columns: 52px 1fr; gap: 14px; padding: 14px; }
      .row-rank { width: 48px; height: 48px; }
      .row-date, .row-arrow { display: none; }
      .team { grid-template-columns: 1fr; }
      .map-hero, .map-bars { padding: 28px; }
      .bar-row { grid-template-columns: 72px 1fr 56px; gap: 10px; }
      .match-nav .btn-primary { flex: 1; padding: 0 12px; font-size: 16px; }
      .to-top { right: 16px; bottom: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .car-track { scroll-behavior: auto; }
    }

    /* ===== v2 additions ===== */
    :root {
      --series-1: #6f79f2;  /* 대원 (검증된 팔레트) */
      --series-2: #d64aa6;  /* 스쿼드 평균 */
      --series-3: #1f9e5f;
      --amber: #f5b03b;
      --gold: #f7c948; --silver: #c9cfe8; --bronze: #d98a5a;
    }
    a { color: inherit; text-decoration: none; }
    .nav-links { overflow-x: auto; scrollbar-width: none; }
    .nav-links::-webkit-scrollbar { display: none; }
    .nav-link { white-space: nowrap; display: inline-flex; align-items: center; }
    .nav-link[aria-current="page"] { color: var(--ink); background: var(--primary); }
    .mock-flag { position: fixed; left: 16px; bottom: 16px; z-index: 35; padding: 8px 14px; border-radius: var(--r-pill); background: rgba(0,0,0,.55); backdrop-filter: blur(8px); font-size: 12px; font-weight: 600; color: var(--muted); }

    /* 맵 아트 (공식 이미지 대신 생성형 지형 일러스트) */
    .art { position: relative; overflow: hidden; aspect-ratio: 16 / 9; background: #10163f; }
    .art svg, .art img, .art video { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; }
    .art .art-label { position: absolute; left: 20px; bottom: 14px; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.85); text-shadow: 0 1px 8px rgba(0,0,0,.5); }
    .art .art-chip { position: absolute; top: 16px; left: 16px; padding: 4px 12px; border-radius: var(--r-lg); background: rgba(0,0,0,.45); backdrop-filter: blur(6px); font-size: 12px; font-weight: 600; }
    .art .art-rank { position: absolute; right: 18px; bottom: 6px; font-size: clamp(56px, 7vw, 84px); font-weight: 900; letter-spacing: -0.05em; line-height: 1; color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.45); }
    .art.has-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.55)); }

    .match-card.with-art { padding: 0; min-height: 0; }
    .match-card.with-art .art { border-radius: var(--r-xl) var(--r-xl) 0 0; }
    .match-card.with-art .body { padding: 22px 26px 26px; }
    .match-card.with-art h3 { margin-top: 0; }
    .match-card.with-art .badge { top: 16px; right: 16px; z-index: 2; }
    .photo-hint { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 4px 10px; border-radius: var(--r-xs); background: rgba(0,0,0,.25); font-size: 13px; font-weight: 600; color: #fff; }

    /* 이달의 MVP 배너 */
    .mvp-banner { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 28px; padding: 32px 40px; border-radius: var(--r-xl); background: linear-gradient(120deg, #2a1f63 0%, var(--primary) 55%, var(--magenta) 120%); position: relative; overflow: hidden; }
    .mvp-banner::before { content: "MVP"; position: absolute; right: -10px; bottom: -40px; font-size: 200px; font-weight: 900; letter-spacing: -0.06em; color: rgba(255,255,255,.07); }
    .crown { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #3b2a00; font-size: 34px; font-weight: 900; box-shadow: 0 0 0 6px rgba(247,201,72,.25); }
    .mvp-banner h3 { margin: 4px 0 0; font-size: clamp(28px, 4vw, 44px); font-weight: 900; letter-spacing: -0.02em; }
    .mvp-banner p { margin: 6px 0 0; color: rgba(255,255,255,.8); }
    .btn-white { display: inline-flex; align-items: center; height: 48px; padding: 0 22px; border: 0; border-radius: var(--r-lg); background: #fff; color: #000; font-weight: 700; cursor: pointer; }

    /* 하이라이트 스트립 / 패치 요약 (홈) */
    .two-col { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; }
    .two-col > *, .duo > *, .patch-layout > * { min-width: 0; }
    .feature-grid.eq { grid-template-columns: repeat(3, 1fr); }
    .panel { padding: 32px; border-radius: var(--r-xl); background: var(--indigo); }
    .panel h3 { margin: 0; font-size: 22px; font-weight: 800; }
    .panel .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .panel-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-bottom: 20px; }
    .more-link { flex: none; font-size: 14px; font-weight: 600; color: var(--link); }

    /* 칩/태그 */
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: var(--r-xs); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .tag.buff { background: rgba(53,237,126,.16); color: var(--green); }
    .tag.nerf { background: rgba(236,72,189,.18); color: #ff8ad6; }
    .tag.change { background: rgba(88,101,242,.25); color: #b9bfff; }
    .tag.return { background: rgba(245,176,59,.18); color: var(--amber); }
    .tag.new { background: var(--green); color: #000; }

    /* 차트 */
    .chart-card { padding: 32px; border-radius: var(--r-xl); background: var(--indigo); }
    .chart-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 8px; }
    .chart-top h3 { margin: 0; font-size: 22px; font-weight: 800; }
    .legend { display: flex; flex-wrap: wrap; gap: 16px; margin: 12px 0 4px; font-size: 14px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 8px; }
    .legend i { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
    .legend i.dash { background: repeating-linear-gradient(90deg, var(--series-2) 0 5px, transparent 5px 8px) !important; }
    .chart { position: relative; margin-top: 8px; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart .grid line { stroke: rgba(255,255,255,.08); }
    .chart .axis text { fill: var(--faint); font-size: 12px; font-family: var(--font); }
    .chart .end-label { font-size: 13px; font-weight: 700; font-family: var(--font); fill: var(--ink); }
    .chart .hit { fill: transparent; cursor: crosshair; }
    .tip { position: absolute; z-index: 5; pointer-events: none; min-width: 150px; padding: 12px 14px; border-radius: var(--r-sm); background: #0b0e2e; box-shadow: 0 8px 30px rgba(0,0,0,.45); font-size: 13px; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }
    .tip.on { opacity: 1; transform: none; }
    .tip b { display: block; margin-bottom: 6px; color: var(--muted); font-weight: 600; }
    .tip div { display: flex; justify-content: space-between; gap: 14px; }
    .tip div span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
    .tip div span i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .tip div strong { color: var(--ink); }
    .chart-note { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
    .chart-note strong { color: var(--ink); }

    /* 대원 화면 추가 카드 */
    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .weapon-mini { display: grid; gap: 14px; }
    .wm-row { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 14px; }
    .wm-rank { font-weight: 900; color: var(--faint); }
    .wm-name { font-weight: 700; }
    .wm-name small { display: block; font-weight: 500; font-size: 12px; color: var(--faint); }
    .wm-row .bar { grid-column: 2 / 4; height: 8px; margin-top: -6px; }
    .wm-row strong { font-size: 18px; font-weight: 800; }
    .tk-big { font-size: clamp(48px, 6vw, 64px); font-weight: 900; line-height: 1; letter-spacing: -0.03em; }
    .tk-sub { margin: 8px 0 0; color: var(--muted); }
    .tk-list { margin: 20px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
    .tk-list li { display: flex; justify-content: space-between; padding: 10px 14px; border-radius: var(--r-sm); background: rgba(255,255,255,.05); font-size: 14px; }

    /* 랭킹 */
    .podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 16px; }
    .pod { padding: 28px 24px; border-radius: var(--r-xl); background: var(--indigo); text-align: center; position: relative; }
    .pod.first { padding-top: 44px; background: linear-gradient(180deg, var(--primary), #3b2fa8); }
    .pod .medal { width: 56px; height: 56px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; font-size: 22px; font-weight: 900; color: #1b1b1b; }
    .pod.first .medal { width: 72px; height: 72px; font-size: 28px; }
    .pod h3 { margin: 16px 0 0; font-size: 22px; font-weight: 800; overflow-wrap: anywhere; }
    .pod .pts { margin-top: 6px; font-size: 34px; font-weight: 900; letter-spacing: -0.02em; }
    .pod .pts small { font-size: 15px; font-weight: 600; color: rgba(255,255,255,.7); }
    .pod .meta { margin-top: 4px; font-size: 13px; color: rgba(255,255,255,.7); }
    .lb { display: grid; gap: 10px; margin-top: 16px; }
    .lb-row { display: grid; grid-template-columns: 48px 1fr 140px 90px; align-items: center; gap: 16px; padding: 14px 20px; border-radius: var(--r-md); background: var(--indigo); }
    .lb-row .r { font-size: 18px; font-weight: 900; color: var(--faint); text-align: center; }
    .lb-row .n { font-weight: 700; }
    .lb-row .n small { display: block; font-weight: 500; color: var(--faint); font-size: 13px; }
    .lb-row .p { text-align: right; font-size: 20px; font-weight: 900; }
    .lb-row .bar { height: 8px; }
    .lb-row.me { box-shadow: inset 0 0 0 2px var(--primary); }
    .season-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 28px; border-radius: var(--r-lg); background: rgba(255,255,255,.06); margin-bottom: 24px; }
    .season-bar strong { font-size: 18px; }
    .season-bar .count { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--green); }
    .reward-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .reward { padding: 28px; border-radius: var(--r-xl); background: var(--indigo); }
    .reward .tier { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; }
    .reward .tier i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
    .reward ul { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
    .reward li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 15px; color: var(--muted); }
    .reward li::before { content: "✦"; color: var(--green); }
    .reward li strong { color: var(--ink); }
    .reward.gold { background: linear-gradient(160deg, #3a2f7a, var(--indigo) 60%); box-shadow: inset 0 0 0 2px rgba(247,201,72,.45); }
    .hof { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
    .hof-item { flex: 0 0 200px; padding: 20px; border-radius: var(--r-lg); background: var(--indigo); }
    .hof-item .m { font-size: 13px; color: var(--faint); }
    .hof-item .w { margin-top: 6px; font-size: 20px; font-weight: 800; }
    .hof-item .s { margin-top: 2px; font-size: 13px; color: var(--muted); }
    .tk-chart { display: grid; gap: 12px; }
    .tk-row { display: grid; grid-template-columns: 150px 1fr 130px; align-items: center; gap: 16px; }
    .tk-row .bar { height: 14px; }
    .tk-row .bar i { background: var(--series-2) !important; }
    .tk-row span:last-child { text-align: right; font-size: 14px; color: var(--muted); }
    .tk-row span:last-child strong { color: var(--ink); font-size: 16px; }

    /* 총기 */
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
    .filters button { height: 40px; padding: 0 18px; border: 0; border-radius: var(--r-pill); background: var(--indigo); color: var(--muted); font-weight: 600; cursor: pointer; transition: background .2s, color .2s; }
    .filters button[aria-pressed="true"] { background: var(--ink); color: #000; }
    .weapon-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .weapon { padding: 28px; border-radius: var(--r-xl); background: var(--indigo); display: flex; flex-direction: column; gap: 18px; }
    .weapon-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
    .weapon-head h3 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: -0.01em; }
    .weapon-head p { margin: 2px 0 0; font-size: 13px; color: var(--faint); }
    .weapon-sil { height: 56px; opacity: .9; }
    .weapon-sil svg { height: 100%; width: auto; }
    .king { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-md); background: rgba(247,201,72,.1); }
    .king .crown { width: 36px; height: 36px; font-size: 16px; box-shadow: none; }
    .king strong { display: block; font-size: 17px; }
    .king span { font-size: 13px; color: var(--muted); }
    .killers { display: grid; gap: 10px; }
    .killer { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
    .killer .bar { grid-column: 1 / -1; height: 6px; }
    .killer em { font-style: normal; font-weight: 800; }

    /* 하이라이트 */
    .hl-feature { display: grid; grid-template-columns: 1.6fr 1fr; gap: 0; border-radius: var(--r-xl); overflow: hidden; background: var(--black); }
    .hl-feature .art { aspect-ratio: auto; min-height: 340px; }
    .hl-feature .info { padding: 36px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
    .hl-feature h3 { margin: 0; font-size: clamp(26px, 3vw, 36px); font-weight: 900; line-height: 1.15; }
    .play { position: absolute; inset: 0; margin: auto; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.92); color: #000; font-size: 26px; z-index: 2; box-shadow: 0 10px 40px rgba(0,0,0,.4); transition: transform .2s; }
    .hl-card:hover .play, .hl-feature:hover .play { transform: scale(1.08); }
    .dur { position: absolute; right: 12px; bottom: 12px; z-index: 2; padding: 3px 8px; border-radius: var(--r-xs); background: rgba(0,0,0,.7); font-size: 12px; font-weight: 700; }
    .hl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .hl-card { display: block; border: 0; padding: 0; border-radius: var(--r-xl); overflow: hidden; background: var(--indigo); color: var(--ink); text-decoration: none; text-align: left; cursor: pointer; }
    .hl-card .play { width: 52px; height: 52px; font-size: 18px; }
    .hl-card .body { padding: 18px 22px 22px; }
    .hl-card h4 { margin: 0; font-size: 17px; font-weight: 800; line-height: 1.3; }
    .hl-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; font-size: 13px; color: var(--muted); }
    .likes { display: inline-flex; align-items: center; gap: 4px; color: #ff8ad6; font-weight: 700; }
    .btn-green.sm { height: 48px; font-size: 16px; padding: 0 22px; }

    /* 업로드 모달 */
    .modal-bg { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; padding: 16px; background: rgba(5,7,30,.72); backdrop-filter: blur(6px); }
    .modal-bg.on { display: grid; animation: fadeIn .2s ease; }
    @keyframes fadeIn { from { opacity: 0; } }
    .modal { width: min(560px, 100%); max-height: 90vh; overflow: auto; padding: 32px; border-radius: 28px; background: var(--indigo); box-shadow: 0 30px 80px rgba(0,0,0,.5); animation: pop .3s cubic-bezier(.2,.9,.3,1.2); }
    @keyframes pop { from { transform: translateY(20px) scale(.97); opacity: 0; } }
    .modal h3 { margin: 0; font-size: 26px; font-weight: 900; }
    .modal .sub { margin: 4px 0 20px; color: var(--muted); font-size: 14px; }
    .drop { display: grid; place-items: center; gap: 6px; padding: 36px 16px; border: 2px dashed rgba(255,255,255,.25); border-radius: var(--r-lg); text-align: center; color: var(--muted); cursor: pointer; transition: border-color .2s, background .2s; }
    .drop:hover, .drop.drag { border-color: var(--green); background: rgba(53,237,126,.06); }
    .drop strong { color: var(--ink); font-size: 17px; }
    .drop .big { font-size: 34px; }
    .or { display: flex; align-items: center; gap: 12px; margin: 16px 0; font-size: 13px; color: var(--faint); }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .field { display: grid; gap: 6px; margin-top: 14px; }
    .field label { font-size: 14px; font-weight: 600; color: var(--muted); }
    .field input, .field select { height: 48px; padding: 0 14px; border: 0; border-radius: var(--r-sm); background: rgba(0,0,0,.28); color: var(--ink); font-size: 16px; outline: 0; }
    .field input:focus, .field select:focus { box-shadow: 0 0 0 2px var(--primary); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    .btn-ghost-sm { height: 48px; padding: 0 20px; border: 0; border-radius: var(--r-sm); background: rgba(255,255,255,.1); font-weight: 600; cursor: pointer; }

    /* 패치노트 */
    .patch-layout { display: grid; grid-template-columns: 260px 1fr; gap: 32px; align-items: start; }
    .timeline { position: sticky; top: 88px; display: grid; gap: 4px; padding-left: 18px; border-left: 2px solid var(--line); }
    .tl-item { position: relative; display: block; width: 100%; padding: 12px 14px; border: 0; border-radius: var(--r-sm); background: none; text-align: left; cursor: pointer; transition: background .2s; }
    .tl-item::before { content: ""; position: absolute; left: -26px; top: 18px; width: 12px; height: 12px; border-radius: 50%; background: var(--canvas); box-shadow: 0 0 0 2px var(--faint); }
    .tl-item[aria-current="true"] { background: var(--indigo); }
    .tl-item[aria-current="true"]::before { background: var(--green); box-shadow: 0 0 0 2px var(--green), 0 0 0 6px rgba(53,237,126,.2); }
    .tl-item strong { display: block; font-size: 16px; }
    .tl-item span { font-size: 13px; color: var(--faint); }
    .patch-hero { padding: 36px; border-radius: var(--r-xl); background: linear-gradient(135deg, #1e2353, #2c2470 60%, #4a2a7a); }
    .patch-hero h2 { margin: 10px 0 0; font-size: clamp(30px, 4vw, 44px); font-weight: 900; letter-spacing: -0.02em; }
    .patch-hero p { margin: 10px 0 0; color: var(--muted); max-width: 640px; }
    .patch-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .callout { display: grid; grid-template-columns: auto 1fr; gap: 16px; margin-top: 16px; padding: 22px 26px; border-radius: var(--r-lg); background: rgba(53,237,126,.08); box-shadow: inset 4px 0 0 var(--green); }
    .callout .ic { font-size: 22px; }
    .callout strong { display: block; margin-bottom: 4px; }
    .callout p { margin: 0; color: var(--muted); font-size: 15px; }
    .patch-sec { margin-top: 36px; }
    .patch-sec h3 { margin: 0 0 16px; font-size: 24px; font-weight: 900; display: flex; align-items: center; gap: 10px; }
    .chg { display: grid; grid-template-columns: 180px 1fr; gap: 20px; padding: 22px 24px; border-radius: var(--r-lg); background: var(--indigo); margin-bottom: 10px; }
    .chg-name { font-size: 18px; font-weight: 800; }
    .chg-name .tag { margin-top: 8px; }
    .stat-diff { display: grid; gap: 10px; }
    .diff { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 12px; font-size: 14px; }
    .diff span:first-child { color: var(--muted); }
    .diff .vals { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
    .diff .old { color: var(--faint); text-decoration: line-through; }
    .diff .arrow { color: var(--faint); }
    .diff .new.up { color: var(--green); font-weight: 800; }
    .diff .new.down { color: #ff8ad6; font-weight: 800; }
    .chg p { margin: 0; color: var(--muted); font-size: 15px; }
    .return-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .return-card { border-radius: var(--r-lg); overflow: hidden; background: var(--indigo); }
    .return-card .art { aspect-ratio: 16 / 10; }
    .return-card .b { padding: 16px 18px; }
    .return-card strong { display: block; }
    .return-card span { font-size: 13px; color: var(--muted); }

    @media (max-width: 1023px) {
      .two-col, .duo { grid-template-columns: 1fr; }
      .feature-grid.eq { grid-template-columns: 1fr 1fr; }
      .weapon-grid, .hl-grid, .reward-grid { grid-template-columns: repeat(2, 1fr); }
      .hl-feature { grid-template-columns: 1fr; }
      .hl-feature .art { min-height: 0; aspect-ratio: 16 / 9; }
      .patch-layout { grid-template-columns: 1fr; }
      .timeline { position: static; display: flex; overflow-x: auto; padding: 0 0 8px; border: 0; gap: 8px; }
      .tl-item { flex: 0 0 auto; width: auto; background: var(--indigo); }
      .tl-item::before { display: none; }
      .tl-item[aria-current="true"] { background: var(--primary); }
      .return-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 767px) {
      .nav-inner { gap: 10px; }
      .nav-link { padding: 8px 10px; font-size: 14px; }
      .mvp-banner { grid-template-columns: 1fr; padding: 28px; gap: 16px; text-align: left; }
      .podium { grid-template-columns: 1fr; }
      .pod.first { order: -1; }
      .lb-row { grid-template-columns: 36px 1fr 70px; padding: 12px 14px; }
      .lb-row .bar { display: none; }
      .weapon-grid, .hl-grid, .reward-grid, .return-grid, .feature-grid.eq { grid-template-columns: 1fr; }
      .tk-row { grid-template-columns: 90px 1fr; }
      .tk-row span:last-child { grid-column: 1 / -1; text-align: left; margin-top: -6px; }
      .chg { grid-template-columns: 1fr; gap: 12px; }
      .chart-card, .panel { padding: 22px; }
      .mock-flag { display: none; }
    }

  </style>
</head>

        <a class="nav-link" href="#/" data-nav="home">홈</a>
        <a class="nav-link" href="#/player/p1" data-nav="player">대원</a>
        <a class="nav-link" href="#/rank" data-nav="rank">랭킹</a>
        <a class="nav-link" href="#/weapons" data-nav="weapons">총기</a>
        <a class="nav-link" href="#/highlights" data-nav="highlights">하이라이트</a>
        <a class="nav-link" href="#/patch" data-nav="patch">패치노트</a>
      </div>
    </div>
  </nav>

  <main id="app" aria-live="polite"></main>

  <footer class="footer">
    <div class="wrap">
      <p class="footer-word" aria-hidden="true">DROPLOG</p>
      <p>디스코드 봇이 수집한 실제 경기 기록이에요. PUBG API 반영 시간에 따라 최근 경기가 늦게 보일 수 있어요.</p>
    </div>
  </footer>

  <button class="to-top" id="to-top" type="button" aria-label="맨 위로">↑</button>

  <div class="modal-bg" id="upload-modal" role="dialog" aria-modal="true" aria-labelledby="upload-title">
    <form class="modal" id="upload-form">
      <h3 id="upload-title">하이라이트 박제하기</h3>
      <p class="sub">내 인생샷을 스쿼드 명예의 전당에 올려보세요</p>
      <label class="drop" id="drop">
        <span class="big" aria-hidden="true">🎬</span>
        <strong>영상 파일을 끌어다 놓거나 눌러서 선택</strong>
        <span>MP4 · WebM · JPG · PNG · 최대 50MB</span>
        <input id="f-file" type="file" accept="video/mp4,video/webm,image/jpeg,image/png,image/webp" hidden>
      </label>
      <div class="or">또는</div>
      <div class="field"><label for="f-link">YouTube · 치지직 · 클립 링크</label><input id="f-link" type="url" placeholder="https://"></div>
      <div class="field"><label for="f-title">제목</label><input id="f-title" type="text" placeholder="예: 사녹 강변 4킬 원맨쇼"></div>
      <div class="field"><label for="f-desc">설명 (선택)</label><input id="f-desc" type="text" maxlength="500" placeholder="왜 박제할 장면인지 한 줄로"></div>
      <div class="field"><label for="f-who">주인공</label><select id="f-who"></select></div>
      <div class="field"><label for="f-match">경기 연결 (선택)</label><select id="f-match"><option>연결 안 함</option><option>10.09 태이고 · #8</option><option>10.08 사녹 · #1 치킨</option></select></div>
      <div class="field"><label for="f-key">관리자 업로드 키</label><input id="f-key" type="password" autocomplete="current-password" placeholder=".env의 WEB_ADMIN_KEY"></div>
      <p class="sub" id="upload-status" role="status"></p>
      <div class="modal-actions">
        <button class="btn-ghost-sm" type="button" data-close>취소</button>
        <button class="btn-green sm" type="submit">올리기</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script>
    /* =========================================================
       DROPLOG v2 — Claude 디자인 위에 실제 SQLite API 연결
       MOCK 객체는 화면 모델이며 bootstrap()이 실제 값으로 채웁니다.
       ========================================================= */
    let MOCK = {
      players: [], weeks: {}, growth: {}, squadGrowth: {}, weapons: [], matches: [], highlights: [],
      hof: [], patches: [], summary: { matches: 0 }, season: { label: "", remainingDays: 0 }
    };

    /* ---------- 공통 유틸 ---------- */
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const hasGsap = typeof gsap !== "undefined" && typeof ScrollTrigger !== "undefined" && !reduceMotion;
    if (hasGsap) { gsap.registerPlugin(ScrollTrigger); document.documentElement.classList.add("motion"); }
    const $ = id => document.getElementById(id);
    const app = $("app");
    const API = location.protocol === "file:" ? "http://127.0.0.1:3000/api" : "/api";
    let activePlayerId = null;
    let currentMatch = null;
    let uploadConfig = { uploadEnabled: false, maxUploadMb: 50 };
    const fmt = n => Number(n).toLocaleString("ko-KR");
    const esc = v => String(v ?? "").replace(/[&<>'"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#039;", '"': "&quot;" })[c]);
    const countAttr = (value, decimals = 0, suffix = "") => `data-count="${value}" data-decimals="${decimals}" data-suffix="${suffix}"`;
    const byName = n => MOCK.players.find(p => p.name === n);
    const TAGS = { buff: "▲ 버프", nerf: "▼ 너프", change: "● 변경", return: "↺ 복각", new: "NEW" };

    async function api(path, options) {
      const response = await fetch(API + path, options);
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || `요청 실패 (${response.status})`);
      return body;
    }

    /* ---------- 맵 아트: 공식 이미지 없이 지형 일러스트를 SVG로 생성 ---------- */
    function rng(seed) { let s = 0; for (const c of String(seed)) s = (s * 31 + c.charCodeAt(0)) >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
    function mapArt(map, seed = map) {
      const r = rng(seed + map);
      const sanhok = map === "사녹";
      const [c1, c2, c3] = sanhok ? ["#0c3a2c", "#17694a", "#3fa56f"] : ["#3a1d0c", "#9a5a1c", "#e2a44a"];
      const line = sanhok ? "rgba(190,255,215,.16)" : "rgba(255,230,190,.17)";
      const id = "g" + Math.floor(r() * 1e9);
      const cx = 200 + r() * 400, cy = 120 + r() * 200;
      let rings = "";
      for (let i = 1; i <= 9; i++) {
        const rx = 40 * i + r() * 14, ry = 26 * i + r() * 10, rot = r() * 40 - 20;
        rings += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${cx} ${cy})" fill="none" stroke="${line}" stroke-width="${i % 3 === 0 ? 1.6 : .9}"/>`;
      }
      const y0 = 60 + r() * 300;
      const river = sanhok
        ? `<path d="M-20 ${y0} C 200 ${y0 - 80 + r() * 160}, 420 ${y0 + 120 - r() * 200}, 820 ${y0 - 40 + r() * 120}" stroke="#3aa0c8" stroke-opacity=".55" stroke-width="${16 + r() * 10}" fill="none" stroke-linecap="round"/>`
        : `<path d="M-20 ${y0} L 820 ${y0 - 120 + r() * 240}" stroke="rgba(30,15,5,.45)" stroke-width="10" fill="none"/><path d="M${200 + r() * 300} -20 L ${260 + r() * 300} 470" stroke="rgba(30,15,5,.35)" stroke-width="6" fill="none"/>`;
      let blobs = "";
      for (let i = 0; i < 14; i++) {
        const x = r() * 800, y = r() * 450, s = 6 + r() * 22;
        blobs += sanhok ? `<circle cx="${x}" cy="${y}" r="${s}" fill="#0a2f22" fill-opacity="${.25 + r() * .35}"/>` : `<rect x="${x}" y="${y}" width="${s * 3}" height="${s * 1.6}" fill="${r() > .5 ? "#b5742a" : "#6e3d14"}" fill-opacity=".35" transform="rotate(${r() * 30 - 15} ${x} ${y})"/>`;
      }
      const zx = 260 + r() * 280, zy = 140 + r() * 170, zr = 70 + r() * 60;
      return `<svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset=".6" stop-color="${c2}"/><stop offset="1" stop-color="${c3}"/></linearGradient></defs>
        <rect width="800" height="450" fill="url(#${id})"/>${blobs}${rings}${river}
        <circle cx="${zx}" cy="${zy}" r="${zr}" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2.5" stroke-dasharray="10 8"/>
        <circle cx="${zx}" cy="${zy}" r="${zr * 2.1}" fill="none" stroke="#5aa0ff" stroke-opacity=".55" stroke-width="3"/>
      </svg>`;
    }
    const art = (map, seed, inner = "", extraClass = "") => `<div class="art ${extraClass}">${mapArt(map, seed)}${inner}</div>`;
    const mediaArt = (map, seed, inner = "", mediaUrl = "") => mediaUrl
      ? `<div class="art has-photo"><img src="${esc(mediaUrl)}" alt="${esc(map)} 경기 이미지" loading="lazy">${inner}</div>`
      : art(map || "사녹", seed, inner);

    /* 총기 실루엣(카테고리별 단순 도형) */
    const SIL = {
      AR: "M4 22h70l6-6h40v6h28v8h-30l-6 10h-14l2-10H58l-10 18H34l6-18H4z",
      DMR: "M2 22h96l4-5h36v5h22v7H136l-6 9h-12l2-9H52l-8 16H32l6-16H2z",
      SR: "M0 22h120l4-4h22v4h14v6h-16l-4 6H128l2-6H44l-8 14H24l6-14H0z",
      SMG: "M20 20h60l6-6h20v6h18v8H102l-6 14H82l2-14H60l-6 16H42l6-16H20z",
      SG: "M6 21h104l6-5h30v5h12v8h-14l-6 8h-12l2-8H48l-8 15H28l6-15H6z"
    };
    const sil = cat => `<svg viewBox="0 0 160 52" aria-hidden="true"><path d="${SIL[cat] || SIL.AR}" fill="rgba(255,255,255,.85)"/></svg>`;

    /* ---------- 라우터: 해시 주소로 화면 전환 → 브라우저 뒤로가기 동작 ---------- */
    const routes = [
      [/^#?\/?$/, renderHome, "home"],
      [/^#\/player\/([^/]+)$/, renderPlayer, "player"],
      [/^#\/match\/([^/]+)$/, renderMatch, "match"],
      [/^#\/rank(?:\/(\w+))?$/, renderRank, "rank"],
      [/^#\/weapons$/, renderWeapons, "weapons"],
      [/^#\/highlights$/, renderHighlights, "highlights"],
      [/^#\/patch(?:\/(\d+))?$/, renderPatch, "patch"]
    ];
    async function router() {
      const hash = location.hash || "#/";
      for (const [re, fn, nav] of routes) {
        const m = hash.match(re);
        if (!m) continue;
        document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
        try {
          app.innerHTML = await fn(...m.slice(1).map(decodeURIComponent));
        } catch (error) {
          app.innerHTML = `<section class="section"><div class="wrap"><div class="empty">데이터를 불러오지 못했어요: ${esc(error.message)}</div></div></section>`;
        }
        window.scrollTo(0, 0);
        afterRender(nav);
        requestAnimationFrame(() => initMotion(app));
        return;
      }
      location.replace("#/");
    }
    window.addEventListener("hashchange", router);

    const afterHooks = {};
    function afterRender(nav) { afterHooks[nav]?.(); }

    /* ---------- 홈 ---------- */
    function renderHome() {
      const mvp = [...MOCK.players].sort((a, b) => b.points - a.points)[0];
      const latestPatch = MOCK.patches[0];
      const season = MOCK.season;
      return `
      <header class="hero center">
        <div class="mesh" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="wrap parallax">
          <p class="eyebrow" data-reveal>디스코드 봇 등록 대원 전용</p>
          <h1 class="display-xl" data-reveal>Drop.<br>Fight.<br>Chicken.</h1>
          <p class="lead" data-reveal>우리 스쿼드의 모든 낙하 기록을 한곳에서 확인하세요.</p>
          <form class="search" id="search-form" data-reveal>
            <div class="search-field"><input class="search-input" id="player-search" type="search" placeholder="닉네임 또는 PUBG 아이디" autocomplete="off"><button class="btn-green" type="submit">전적 검색</button></div>
          </form>
          <div class="chips" data-reveal>${MOCK.players.map(p => `<a class="chip" style="display:inline-flex;align-items:center" href="#/player/${p.id}">${esc(p.name)}</a>`).join("")}</div>
        </div>
      </header>
      <div class="marquee" aria-hidden="true"><div class="marquee-track">${(() => { const l = ["Sanhok", "Taego", `${MOCK.summary.matches} matches`, "Winner winner", "Chicken dinner"].map(w => `<span>${w} <i>✦</i></span>`).join(""); return l + l; })()}</div></div>

      <section class="section-sm"><div class="wrap">
        <a class="mvp-banner" href="#/rank" data-reveal>
          <span class="crown" aria-hidden="true">♛</span>
          <div><span class="eyebrow" style="margin:0;background:rgba(0,0,0,.25)">${esc(season.label)} · 1위 질주 중</span><h3>${esc(mvp.name)}</h3><p>${fmt(mvp.points)}점 · 미션 ${mvp.missions}개 완료 · 시즌 종료까지 ${season.remainingDays}일</p></div>
          <span class="btn-white">랭킹 보기 ›</span>
        </a>
      </div></section>

      <section class="section-sm"><div class="wrap">
        <div class="head" data-reveal><div><h2 class="display-md">최근 경기</h2><p>맵 일러스트 위에 경기 스크린샷이 있으면 그 사진이 대신 들어가요</p></div></div>
        <div class="feature-grid eq">${MOCK.matches.map((m, i) => `
          <a class="match-card with-art ${i === 1 ? "is-feature" : ""}" href="#/match/${encodeURIComponent(m.id)}">
            ${mediaArt(m.map, m.id, `<span class="art-chip">${m.map} · ${m.date}</span><span class="art-rank num">#${m.placement ?? "-"}</span>`, m.photoUrl)}
            ${m.placement === 1 ? '<span class="badge">치킨</span>' : ""}
            <div class="body"><h3>${m.placement === 1 ? "치킨 디너!" : m.placement <= 10 ? `TOP 10 진입 · ${m.placement}위` : `${m.placement}위로 마무리`}</h3><p>팀 ${m.kills}킬 · ${fmt(m.damage)} 딜량 · ${m.dur}</p>
            ${m.photoUrl ? '<span class="photo-hint">스크린샷 연결됨</span>' : ""}</div>
          </a>`).join("")}</div>
      </div></section>

      <section class="section"><div class="wrap two-col">
        <div class="panel" data-reveal>
          <div class="panel-head"><div><h3>새 하이라이트</h3><p class="sub">이번 주 스쿼드가 박제한 장면</p></div><a class="more-link" href="#/highlights">전체 보기 ›</a></div>
          ${MOCK.highlights.length ? `<div class="carousel" data-carousel="hl"><div class="car-track">${MOCK.highlights.slice(0, 4).map(hlCard).join("")}</div><div class="dots" data-car-dots="hl"></div></div>
          <div class="car-controls" style="justify-content:flex-end;margin-top:8px"><button class="car-btn" type="button" data-car-prev="hl" aria-label="이전">‹</button><button class="car-btn" type="button" data-car-next="hl" aria-label="다음">›</button></div>
          ` : '<div class="empty">아직 올라온 하이라이트가 없어요</div>'}
        </div>
        <a class="panel" href="#/patch" data-reveal style="display:block">
          <div class="panel-head"><div><h3>최신 패치</h3><p class="sub">${latestPatch.date} · ${esc(latestPatch.v)}</p></div><span class="more-link">자세히 ›</span></div>
          <p style="margin:0;font-size:24px;font-weight:900;line-height:1.25">${esc(latestPatch.title)}</p>
          <div class="patch-tags">${latestPatch.tags.map(t => `<span class="tag ${t}">${TAGS[t]}</span>`).join("")}</div>
          <div class="callout"><span class="ic">i</span><div><strong>공식 업데이트</strong><p>${esc(latestPatch.impact || "공식 공지에서 세부 변경사항을 확인하세요.")}</p></div></div>
        </a>
      </div></section>`;
    }
    afterHooks.home = () => {
      $("search-form").addEventListener("submit", e => {
        e.preventDefault();
        const q = $("player-search").value.trim().toLowerCase();
        const p = MOCK.players.find(x => x.name.toLowerCase().includes(q) || x.pubg.toLowerCase().includes(q));
        if (q && p) location.hash = `#/player/${p.id}`;
      });
      if (MOCK.highlights.length) initCarousel("hl");
    };

    function hlCard(h) {
      return `<a class="hl-card" href="${esc(h.mediaUrl || "#/highlights")}" ${h.mediaUrl ? 'target="_blank" rel="noopener"' : ""} data-hl="${h.id}" style="flex:0 0 calc((100% - 16px) / 2);min-width:220px;scroll-snap-align:start">
        ${mediaArt(h.map || "사녹", h.id, `<span class="play" aria-hidden="true">▶</span><span class="dur">${esc(h.mediaType === "link" ? "LINK" : "FILE")}</span>`, h.mediaType === "image" ? h.mediaUrl : "")}
        <div class="body"><h4>${esc(h.title)}</h4><div class="hl-meta"><span>${esc(h.who)}</span><span>${h.map} · ${h.date}</span><span class="likes">♥ ${h.likes}</span></div></div>
      </a>`;
    }

    /* ---------- 대원 ---------- */
    let growthMetric = "adr";
    function renderPlayer(id) {
      const p = MOCK.players.find(x => x.id === id) || MOCK.players[0];
      activePlayerId = p.id;
      const myWeapons = MOCK.weapons.map(w => ({ w, k: (w.top.find(t => t[0] === p.name) || [, 0])[1] })).filter(x => x.k).sort((a, b) => b.k - a.k).slice(0, 4);
      const maxK = myWeapons[0]?.k || 1;
      const tkShare = p.kills ? (p.teamKills / (p.kills + p.teamKills) * 100) : 0;
      return `
      <header class="hero op-hero center">
        <div class="mesh" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="wrap parallax">
          <a class="back" href="#/">‹ 홈</a>
          <p class="eyebrow" data-reveal>${esc(p.pubg)}</p>
          <h1 class="display-xl" data-reveal>${esc(p.name)}</h1>
          <div class="op-meta" data-reveal><span>${p.games}경기</span><span>미션 ${fmt(p.points)}점</span><span>최장 킬 ${p.longest}m</span></div>
        </div>
      </header>
      <section class="section-sm"><div class="wrap">
        <div class="stats">
          <div class="stat blurple"><span class="stat-value num" ${countAttr(p.kd, 2)}>${p.kd}</span><div><span class="stat-label">K/D</span><span class="stat-note">${p.kills}킬 · 헤드샷 ${p.hs}%</span></div></div>
          <div class="stat magenta"><span class="stat-value num" ${countAttr(p.adr)}>${p.adr}</span><div><span class="stat-label">평균 딜량</span><span class="stat-note">경기당 피해량</span></div></div>
          <div class="stat"><span class="stat-value num" ${countAttr(p.top10, 1, "%")}>${p.top10}%</span><div><span class="stat-label">TOP 10</span><div class="meter"><span data-width="${p.top10}"></span></div></div></div>
          <div class="stat"><span class="stat-value num" ${countAttr(p.wins)}>${p.wins}</span><div><span class="stat-label">치킨</span><span class="stat-note">승률 ${(p.wins / p.games * 100).toFixed(1)}%</span></div></div>
        </div>
      </div></section>

      <section class="section-sm"><div class="wrap">
        <div class="chart-card" data-reveal>
          <div class="chart-top">
            <div><h3>실력 변화</h3><p class="sub" style="margin:4px 0 0;color:var(--muted);font-size:14px">주간 평균 · 스쿼드 평균과 비교</p></div>
            <div class="seg" role="tablist" id="growth-tabs">
              <button type="button" role="tab" aria-selected="true" data-metric="adr">평균 딜량</button>
              <button type="button" role="tab" aria-selected="false" data-metric="kd">K/D</button>
              <button type="button" role="tab" aria-selected="false" data-metric="top10">TOP 10</button>
            </div>
          </div>
          <div class="legend"><span><i style="background:var(--series-1)"></i>${esc(p.name)}</span><span><i class="dash"></i>스쿼드 평균</span></div>
          <div class="chart" id="growth-chart"></div>
          <p class="chart-note" id="growth-note"></p>
        </div>
      </div></section>

      <section class="section-sm"><div class="wrap duo">
        <div class="panel" data-reveal>
          <div class="panel-head"><div><h3>주력 총기</h3><p class="sub">이 총으로 가장 많이 잡았어요</p></div><a class="more-link" href="#/weapons">총기 랭킹 ›</a></div>
          <div class="weapon-mini">${myWeapons.map((x, i) => `
            <div class="wm-row"><span class="wm-rank">${i + 1}</span><span class="wm-name">${esc(x.w.name)}<small>${x.w.cat}</small></span><strong class="num">${x.k}킬</strong>
            <span class="bar"><i data-width="${(x.k / maxK * 100).toFixed(1)}"></i></span></div>`).join("") || '<p class="muted">총기 기록이 아직 없어요</p>'}</div>
        </div>
        <div class="panel" data-reveal>
          <div class="panel-head"><div><h3>팀킬 기록</h3><p class="sub">전체 킬 중 아군을 잡은 비중</p></div><a class="more-link" href="#/rank/teamkill">팀킬 랭킹 ›</a></div>
          <div class="tk-big num">${tkShare.toFixed(1)}<span style="font-size:.45em;color:var(--muted)">%</span></div>
          <p class="tk-sub">${p.teamKills}번 팀킬 · 적 ${p.kills}킬</p>

        const b = e.target.closest("[data-metric]"); if (!b) return;

    /* 실력 변화 라인차트: 단일 y축, 2px 선, 크로스헤어 + 툴팁, 끝점 직접 라벨 */
    function drawGrowth(animate = false) {
      const host = $("growth-chart"); if (!host) return;
      const me = MOCK.growth[activePlayerId]?.[growthMetric] ?? [];
      const sq = MOCK.squadGrowth[activePlayerId]?.[growthMetric] ?? [];
      const labels = MOCK.weeks[activePlayerId] ?? [];
      if (labels.length < 2 || !me.length || !sq.length) {
        host.innerHTML = '<div class="empty">비교할 주간 기록이 아직 부족해요</div>';
        $("growth-note").textContent = "경기가 더 쌓이면 주간 변화가 표시돼요.";
        return;
      }
      const fmtV = v => growthMetric === "kd" ? v.toFixed(2) : growthMetric === "top10" ? v + "%" : String(v);
      const W = 760, H = 300, L = 44, R = 70, T = 16, B = 34;
      const all = [...me, ...sq];
      let lo = Math.min(...all), hi = Math.max(...all);
      const pad = (hi - lo) * .2 || 1; lo = Math.max(0, lo - pad); hi = hi + pad;
      const x = i => L + i * (W - L - R) / (labels.length - 1);
      const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
      const ticks = Array.from({ length: 4 }, (_, i) => lo + (hi - lo) * i / 3);
      const path = arr => arr.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
      host.innerHTML = `
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="주간 ${growthMetric} 추이">
          <g class="grid">${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g>
          <g class="axis">${ticks.map(t => `<text x="${L - 10}" y="${y(t) + 4}" text-anchor="end">${fmtV(growthMetric === "kd" ? +t.toFixed(2) : Math.round(t))}</text>`).join("")}
            ${labels.map((l, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${l}</text>`).join("")}</g>
          <path class="ln sq" d="${path(sq)}" fill="none" stroke="var(--series-2)" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
          <path class="ln me" d="${path(me)}" fill="none" stroke="var(--series-1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          ${me.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--series-1)" stroke="var(--indigo)" stroke-width="2"/>`).join("")}
          <text class="end-label" x="${x(me.length - 1) + 10}" y="${y(me.at(-1)) + 4}">${fmtV(me.at(-1))}</text>
          <text class="end-label" x="${x(sq.length - 1) + 10}" y="${y(sq.at(-1)) + 4}" style="fill:var(--muted)">${fmtV(sq.at(-1))}</text>
          <line id="xhair" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="rgba(255,255,255,.35)" stroke-width="1" opacity="0"/>
          <rect class="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}"/>
        </svg>
        <div class="tip" id="growth-tip"></div>`;
      const delta = me.at(-1) - me[0];
      $("growth-note").innerHTML = `첫 주 대비 <strong>${delta >= 0 ? "+" : ""}${growthMetric === "kd" ? delta.toFixed(2) : Math.round(delta)}${growthMetric === "top10" ? "%p" : ""}</strong> · 스쿼드 평균보다 <strong>${fmtV(+(me.at(-1) - sq.at(-1)).toFixed(2))}</strong> 높아요`;
      if (animate || hasGsap) host.querySelectorAll(".ln").forEach(p => { const len = p.getTotalLength(); p.style.strokeDasharray = p.classList.contains("sq") ? "6 4" : `${len}`; if (!p.classList.contains("sq")) { p.style.strokeDashoffset = len; p.getBoundingClientRect(); p.style.transition = "stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)"; p.style.strokeDashoffset = 0; } });
      const svg = host.querySelector("svg"), tip = $("growth-tip"), xh = $("xhair");
      const move = ev => {
        const pt = svg.getBoundingClientRect();
        const px = (ev.clientX - pt.left) / pt.width * W;
        const i = Math.max(0, Math.min(labels.length - 1, Math.round((px - L) / ((W - L - R) / (labels.length - 1)))));
        xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("opacity", 1);
        tip.innerHTML = `<b>${labels[i]} 주</b><div><span><i style="background:var(--series-1)"></i>나</span><strong>${fmtV(me[i])}</strong></div><div><span><i style="background:var(--series-2)"></i>스쿼드</span><strong>${fmtV(sq[i])}</strong></div>`;
        const left = x(i) / W * pt.width;
        tip.style.left = Math.min(pt.width - 160, Math.max(0, left + 12)) + "px";
        tip.style.top = (y(me[i]) / H * pt.height - 30) + "px";
        tip.classList.add("on");
      };
      const hit = svg.querySelector(".hit");
      hit.addEventListener("pointermove", move);
      hit.addEventListener("pointerleave", () => { tip.classList.remove("on"); xh.setAttribute("opacity", 0); });
    }
